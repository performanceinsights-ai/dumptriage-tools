name: Release

# A v* tag publishes every tool as a GitHub Release asset. Asset names carry no
# version, so https://github.com/performanceinsights-ai/dumptriage-tools/releases/latest/download/<name>
# always serves the newest one: the downloads page on performanceinsights.ai links there.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # A change to this file or the Windows installer builds everything without publishing (and runs Install.cmd from
  # the built zip), so a broken package shows up before a tag.
  pull_request:
    paths: [".github/workflows/release.yml", "windows/dumptriage-agent/installer/**"]

permissions:
  contents: read

jobs:
  windows-agent:
    # The tray app needs the Windows Desktop SDK, so this builds on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Publish the agent and tray app
        shell: pwsh
        working-directory: windows/dumptriage-agent
        run: |
          $out = "$env:RUNNER_TEMP\dumptriage-agent-windows-x64"
          dotnet publish src/DumpTriageAgent -c Release -r win-x64 --self-contained -o "$out\agent"
          dotnet publish src/DumpTriageTray -c Release -r win-x64 --self-contained -o "$out\tray"
          Copy-Item -Recurse installer -Destination "$out\installer"
          Remove-Item -Recurse -Force "$out\installer\linux" -ErrorAction SilentlyContinue
          # The double-click launcher sits at the zip root, beside agent\, tray\ and installer\ (#80).
          Move-Item "$out\installer\Install.cmd" "$out\Install.cmd"
          Copy-Item README.md, ..\..\LICENSE -Destination $out
          Compress-Archive -Path "$out\*" -DestinationPath "$env:RUNNER_TEMP\dumptriage-agent-windows-x64.zip"
      - name: Install.cmd installs the agent from the extracted zip, uninstall.ps1 removes it (#80)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\zip-check"
          Expand-Archive "$env:RUNNER_TEMP\dumptriage-agent-windows-x64.zip" -DestinationPath $dir
          # The runner is already elevated, so this takes Install.cmd's install path, not the UAC relaunch. A key file
          # (passed on to install.ps1) instead of the masked prompt, which reads the console, not stdin, and would hang
          # here; empty stdin answers the closing `pause`. Runner paths have no spaces, so nothing is quoted.
          $keyFile = "$env:RUNNER_TEMP\ci-key.txt"
          Set-Content -Path $keyFile -Value "dts_ci_not_a_real_key" -NoNewline
          $noInput = New-Item -ItemType File "$env:RUNNER_TEMP\no-input.txt" -Force
          $run = Start-Process cmd.exe -ArgumentList "/c $dir\Install.cmd -ApiKeyFile $keyFile" -RedirectStandardInput $noInput -NoNewWindow -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Install.cmd exited with $($run.ExitCode)" }
          if (Test-Path $keyFile) { throw "install.ps1 did not store the key (the key file is still there)" }
          if ((Get-Content -Raw "$env:ProgramData\DumpTriage\config.json") -match 'dts_ci_not_a_real_key') { throw "the key is in config.json in plaintext" }
          $service = Get-Service DumpTriageAgent
          if ($service.Status -ne 'Running') { throw "DumpTriageAgent is $($service.Status), not Running" }
          Get-ScheduledTask -TaskName DumpTriageTray | Out-Null
          & "$dir\installer\uninstall.ps1" -RemoveData
          if (Get-Service DumpTriageAgent -ErrorAction SilentlyContinue) { throw "uninstall.ps1 left the service" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-agent
          path: ${{ runner.temp }}/dumptriage-agent-windows-x64.zip
          if-no-files-found: error

  release:
    needs: windows-agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance for every asset (#65): a customer checks a download with
      # `gh attestation verify <file> -R performanceinsights-ai/dumptriage-tools`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-agent
          path: dist
      - name: Package the Linux agent and the standalone scripts
        run: |
          set -euo pipefail
          stage=$(mktemp -d)/dumptriage-agent-linux
          mkdir -p "$stage"
          # install.sh finds the agent at ../dumptriage_agent.py, so the tree keeps its shape.
          cp -r linux/dumptriage-agent/dumptriage_agent.py linux/dumptriage-agent/installer linux/dumptriage-agent/perfetto linux/dumptriage-agent/README.md LICENSE "$stage/"
          cp linux/configure-dumps.sh linux/configure-tracing.sh "$stage/"
          tar -C "$(dirname "$stage")" -czf dist/dumptriage-agent-linux.tar.gz dumptriage-agent-linux
          cp windows/Set-WerLocalDumps.ps1 windows/Set-WerLiveKernelReports.ps1 windows/Start-PerfTrace.ps1 windows/PerfInsights.wprp \
             linux/configure-dumps.sh linux/configure-tracing.sh \
             macos/dumptriage-collect.sh rmm/ninjaone/Invoke-DumpTriageCollect.ps1 \
             schemas/tracing-config.schema.json schemas/trace-manifest.schema.json dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attest the assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

name: macOS trace capture

# Captures real spindump, sample and xctrace output on GitHub's macOS runners, for the website's macOS trace parsers
# and the open questions in #31 (#41). Run it by hand; it also runs on a PR that changes it.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Capture length in seconds (30 to 120, as the collector takes; website#2208)
        type: number
        default: 30
  pull_request:
    paths:
      - .github/workflows/macos-trace-capture.yml
      - macos/tests/burn.c
      - macos/tests/fake_trace_service.py
      - macos/dumptriage-collect.sh

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75  # about ten captures of 30 to 120 s each, one after another, plus setup
    defaults:
      run:
        shell: bash  # with pipefail, so a capture piped into tee still fails when the tool does
    env:
      SECONDS_TO_CAPTURE: ${{ inputs.seconds || '30' }}
      OUT: ${{ github.workspace }}/capture
      WORK: ${{ github.workspace }}/../capture-work
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          case "$SECONDS_TO_CAPTURE" in
            ''|*[!0-9]*) echo "seconds must be a whole number, got '$SECONDS_TO_CAPTURE'"; exit 1 ;;
          esac
          if [ "$SECONDS_TO_CAPTURE" -lt 30 ] || [ "$SECONDS_TO_CAPTURE" -gt 120 ]; then
            echo "seconds must be 30 to 120, got $SECONDS_TO_CAPTURE"; exit 1
          fi
          mkdir -p "$OUT" "$WORK"
          {
            sw_vers
            uname -a
            sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
            echo "xcode-select: $(xcode-select -p)"
            xcodebuild -version || true
            echo "xctrace: $(xcrun --find xctrace 2>&1)"
            # Whether xctrace ships with the Command Line Tools alone or needs full Xcode (#31).
            if [ -d /Library/Developer/CommandLineTools ]; then
              echo "xctrace under CommandLineTools: $(DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find xctrace 2>&1)"
            fi
            xcrun xctrace version || true
            echo "installed Xcodes:"
            ls -d /Applications/Xcode*.app 2>&1
          } > "$OUT/environment.txt" 2>&1
          cat "$OUT/environment.txt"
          # The tools' own usage text, to pin the flags each macOS version takes.
          spindump -h > "$OUT/spindump-help.txt" 2>&1 || true
          sample > "$OUT/sample-help.txt" 2>&1 || true
          xcrun xctrace help > "$OUT/xctrace-help.txt" 2>&1 || true
          xcrun xctrace help record > "$OUT/xctrace-help-record.txt" 2>&1 || true
          xcrun xctrace help symbolicate > "$OUT/xctrace-help-symbolicate.txt" 2>&1 || true
          xcrun xctrace help export > "$OUT/xctrace-help-export.txt" 2>&1 || true

      - name: Start the burner
        run: |
          clang -g -O0 -o "$WORK/dtburn" macos/tests/burn.c
          # Long enough for every capture below; stopped at the end either way.
          "$WORK/dtburn" $(( SECONDS_TO_CAPTURE * 14 + 600 )) > /dev/null &
          echo "BURN_PID=$!" >> "$GITHUB_ENV"
          echo "burner pid $!"

      - name: spindump, system-wide
        continue-on-error: true
        run: |
          # -notarget: a bare number would be read as a pid, not a duration.
          sudo spindump -notarget "$SECONDS_TO_CAPTURE" 10 -file "$OUT/spindump.txt" 2>&1 | tee "$OUT/spindump-log.txt"
          sudo chown "$USER" "$OUT/spindump.txt"
          test -s "$OUT/spindump.txt"

      - name: spindump, the burner only
        continue-on-error: true
        run: |
          # As dumptriage-collect.sh --spindump runs it: one target, default interval.
          sudo spindump "$BURN_PID" "$SECONDS_TO_CAPTURE" -file "$OUT/spindump-target.txt" 2>&1 | tee "$OUT/spindump-target-log.txt"
          sudo chown "$USER" "$OUT/spindump-target.txt"
          test -s "$OUT/spindump-target.txt"

      - name: sample, the burner
        continue-on-error: true
        run: |
          sample "$BURN_PID" "$SECONDS_TO_CAPTURE" 1 -file "$OUT/sample.txt" 2>&1 | tee "$OUT/sample-log.txt"
          test -s "$OUT/sample.txt"

      - name: xctrace Time Profiler, all processes
        continue-on-error: true
        timeout-minutes: 15  # xctrace on the macos-26 image sometimes never returns; a hang costs this step, not the job (#47)
        run: |
          # Unprivileged first, as a customer would run it; sudo only if that fails, and say which one worked (#31).
          # The unprivileged exit code and log stay in the artifact, so a failure that was not about privilege shows.
          if xcrun xctrace record --template 'Time Profiler' --all-processes --time-limit "${SECONDS_TO_CAPTURE}s" \
               --no-prompt --output "$WORK/cap.trace" > "$OUT/xctrace-record-log.txt" 2>&1; then
            echo "unprivileged" > "$OUT/xctrace-record-mode.txt"
          else
            echo "unprivileged attempt failed with exit $?; retried with sudo" > "$OUT/xctrace-record-mode.txt"
            rm -rf "$WORK/cap.trace"
            sudo xcrun xctrace record --template 'Time Profiler' --all-processes --time-limit "${SECONDS_TO_CAPTURE}s" \
              --no-prompt --output "$WORK/cap.trace" >> "$OUT/xctrace-record-log.txt" 2>&1
            sudo chown -R "$USER" "$WORK/cap.trace"
            echo "sudo" >> "$OUT/xctrace-record-mode.txt"
          fi
          cat "$OUT/xctrace-record-log.txt" "$OUT/xctrace-record-mode.txt"
          xcrun xctrace export --input "$WORK/cap.trace" --toc --output "$OUT/xctrace-toc.xml"
          xcrun xctrace export --input "$WORK/cap.trace" \
            --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' \
            --output "$OUT/xctrace-time-profile.xml"
          test -s "$OUT/xctrace-time-profile.xml"

      - name: dumptriage-collect.sh with its real tools, against a stand-in service
        run: |
          # /bin/bash is bash 3.2 here, the one a customer has. --profile and --xctrace use sudo and Xcode as on a Mac.
          mkdir -p "$OUT/service"
          python3 macos/tests/fake_trace_service.py "$OUT/service" 8765 &
          SERVICE_PID=$!
          sleep 2
          export DUMPTRIAGE_API_URL=http://127.0.0.1:8765 DUMPTRIAGE_API_KEY=dt_ci_key HOME="$WORK/home"
          mkdir -p "$HOME"
          status=0
          for args in "--profile $SECONDS_TO_CAPTURE" "--sample $BURN_PID $SECONDS_TO_CAPTURE" "--xctrace $SECONDS_TO_CAPTURE"; do
            echo "=== dumptriage-collect.sh $args" | tee -a "$OUT/collector-log.txt"
            echo y | /bin/bash macos/dumptriage-collect.sh $args 2>&1 | tee -a "$OUT/collector-log.txt" || status=1
          done
          kill "$SERVICE_PID" 2>/dev/null || true
          ls -l "$OUT/service"
          for t in spindump_text sample_text xctrace_export; do
            grep -l "\"traceType\":\"$t\"" "$OUT"/service/*.manifest > /dev/null || { echo "no $t upload reached the service"; status=1; }
          done
          exit $status

      - name: watch mode with the real top and sysctl (the tracing config, --watch-once, --send-held)
        run: |
          # The readings come from this Mac (top, sysctl), not from the test hook. The burner holds a core, so a
          # per-process trigger on `dtburn` at 50% must fire; a threshold of 0 on the whole Mac and on the load must too.
          export HOME="$WORK/watchhome" DUMPTRIAGE_NOW=
          unset DUMPTRIAGE_NOW
          mkdir -p "$HOME/.config/dumptriage" "$OUT/watch"
          cat > "$HOME/.config/dumptriage/tracing.json" <<'JSON'
          {"schemaVersion": 1, "enabled": true, "backend": "spindump",
           "triggers": [
             {"name": "any-cpu", "type": "cpuPercent", "threshold": 0},
             {"name": "burner", "type": "cpuPercent", "process": "dtburn", "threshold": 50},
             {"name": "any-load", "type": "loadPerCpu", "threshold": 0},
             {"name": "never", "type": "cpuPercent", "process": "dtburn", "threshold": 100000},
             {"name": "no-psi", "type": "psiSomeAvg10", "threshold": 1}],
           "limits": {"maxDurationSec": 30, "cooldownMin": 0, "dailyCap": 10}}
          JSON
          sed -i.bak 's/^          //' "$HOME/.config/dumptriage/tracing.json" && rm -f "$HOME/.config/dumptriage/tracing.json.bak"
          status=0
          echo "=== decisions with the real readings (dry run)" | tee "$OUT/watch/log.txt"
          /bin/bash macos/dumptriage-collect.sh --watch-once --dry-run 2>&1 | tee -a "$OUT/watch/log.txt"
          for want in "trigger any-cpu: fire" "trigger burner: fire" "trigger any-load: fire" "trigger never: no_fire" "trigger no-psi: no_fire"; do
            grep -q "$want" "$OUT/watch/log.txt" || { echo "missing: $want"; status=1; }
          done
          echo "=== a real capture, held (root: the runner's sudo)" | tee -a "$OUT/watch/log.txt"
          sudo -E /bin/bash macos/dumptriage-collect.sh --watch-once 2>&1 | tee -a "$OUT/watch/log.txt"
          sudo chown -R "$USER" "$HOME/.config/dumptriage"
          find "$HOME/.config/dumptriage/tracing-state/spool" -type f | tee -a "$OUT/watch/log.txt"
          for f in manifest.json type trace; do
            find "$HOME/.config/dumptriage/tracing-state/spool" -name "$f" -size +0 | grep -q . || { echo "no $f held"; status=1; }
          done
          cp "$HOME/.config/dumptriage/tracing-state/spool"/*/manifest.json "$OUT/watch/" 2>/dev/null || true
          exit $status

      - name: xctrace symbolicate experiment (Xcode 15.4 on macOS 14 exported 98% of frames as addresses)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # How many of an export's frames are named, raw and after `xctrace symbolicate` (website#2206).
          count() {
            rm -f "$WORK/count.xml"
            xcrun xctrace export --input "$1" --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' --output "$WORK/count.xml" > /dev/null 2>&1 || { echo "$2: export failed"; return 0; }
            # `|| true` here and on the symbolicate calls: under bash -e and pipefail a refused symbolicate ("No dSYMs
            # were found") or a grep that matches nothing ended the block before the --dsym try ever ran (#47 review).
            total=$({ grep -o '<frame id="[0-9]*" name="[^"]*"' "$WORK/count.xml" || true; } | wc -l | tr -d ' ')
            raw=$({ grep -o '<frame id="[0-9]*" name="0x[0-9a-fA-F]*"' "$WORK/count.xml" || true; } | wc -l | tr -d ' ')
            echo "$2: $total frames defined, $raw named as addresses"
          }
          # The dSYM of the burner that is running, so --dsym has something to name.
          dsymutil "$WORK/dtburn" -o "$WORK/dtburn.dSYM" > /dev/null 2>&1
          {
            xcrun xctrace record --template 'Time Profiler' --all-processes --time-limit 5s --no-prompt --output "$WORK/sym.trace" 2>&1 | tail -2 || true
            count "$WORK/sym.trace" "raw export"
            echo "== xctrace symbolicate, no --dsym"
            xcrun xctrace symbolicate --input "$WORK/sym.trace" --output "$WORK/sym-a.trace" 2>&1 | tail -3 || true
            if [ -e "$WORK/sym-a.trace" ]; then count "$WORK/sym-a.trace" "after symbolicate (no dsym)"; fi
            echo "== xctrace symbolicate --dsym the burner's dSYM"
            xcrun xctrace symbolicate --input "$WORK/sym.trace" --output "$WORK/sym-b.trace" --dsym "$WORK/dtburn.dSYM" 2>&1 | tail -3 || true
            if [ -e "$WORK/sym-b.trace" ]; then count "$WORK/sym-b.trace" "after symbolicate --dsym"; fi
          } > "$OUT/xctrace-symbolicate.txt" 2>&1
          cat "$OUT/xctrace-symbolicate.txt"

      - name: xctrace with the newest Xcode of each major version (Xcode 15.4 on macOS 14 names 2% of frames, #46)
        if: matrix.os == 'macos-14'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          # The image ships several Xcodes; record and export with the newest release of each major version and count
          # how many frames come back named, and whether the burner's own function is among them. Counts end in
          # `|| true`: under bash -e and pipefail a grep that matches nothing would end the step (#47 review).
          mkdir -p "$OUT/xcodes"
          frames() { { grep -o "$1" "$2" 2>/dev/null || true; } | wc -l | tr -d ' '; }
          releases() {  # Xcode_<version>.app only: no Xcode.app symlink, no beta or release candidate
            for app in /Applications/Xcode_[0-9]*.app; do
              [ -d "$app" ] || continue
              case "$app" in *[Bb]eta*|*_RC*|*Release_Candidate*) continue ;; esac
              echo "$app"
            done | sort -V
          }
          releases > "$OUT/xcodes/releases.txt"
          cat "$OUT/xcodes/releases.txt"
          for major in 15 16 26; do
            app=$({ grep "/Xcode_${major}[.]" "$OUT/xcodes/releases.txt" || true; } | tail -1)
            if [ -z "$app" ]; then echo "Xcode $major: not installed" | tee -a "$OUT/xcodes/summary.txt"; continue; fi
            dev="$app/Contents/Developer"
            name=$(basename "$app" .app)
            trace="$WORK/$name.trace"
            mode=unprivileged
            if ! DEVELOPER_DIR="$dev" xcrun xctrace record --template 'Time Profiler' --all-processes \
                 --time-limit "${SECONDS_TO_CAPTURE}s" --no-prompt --output "$trace" > "$OUT/xcodes/$name-record.txt" 2>&1; then
              rm -rf "$trace"
              mode=sudo
              if ! sudo DEVELOPER_DIR="$dev" xcrun xctrace record --template 'Time Profiler' --all-processes \
                   --time-limit "${SECONDS_TO_CAPTURE}s" --no-prompt --output "$trace" >> "$OUT/xcodes/$name-record.txt" 2>&1; then
                echo "$name: record failed, unprivileged and with sudo" | tee -a "$OUT/xcodes/summary.txt"; continue
              fi
              sudo chown -R "$USER" "$trace"
            fi
            if ! DEVELOPER_DIR="$dev" xcrun xctrace export --input "$trace" \
                 --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' --output "$OUT/xcodes/$name.xml" \
                 >> "$OUT/xcodes/$name-record.txt" 2>&1; then
              echo "$name: export failed" | tee -a "$OUT/xcodes/summary.txt"; continue
            fi
            total=$(frames '<frame id="[0-9]*" name="[^"]*"' "$OUT/xcodes/$name.xml")
            raw=$(frames '<frame id="[0-9]*" name="0x[0-9a-fA-F]*"' "$OUT/xcodes/$name.xml")
            burner=$(frames 'name="dt_burn_inner"' "$OUT/xcodes/$name.xml")
            version=$(DEVELOPER_DIR="$dev" xcrun xctrace version 2>&1 | head -n 1)
            echo "$name ($version, $mode): $total frames defined, $raw named as addresses, dt_burn_inner named: $burner" \
              | tee -a "$OUT/xcodes/summary.txt"
            gzip -f "$OUT/xcodes/$name.xml"
          done

      - name: dumptriage-collect.sh --xctrace with the newest Xcode (macOS 14, #46)
        if: matrix.os == 'macos-14'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          app=$(tail -1 "$OUT/xcodes/releases.txt")
          [ -n "$app" ] || { echo "no Xcode release found"; exit 1; }
          export DEVELOPER_DIR="$app/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          mkdir -p "$OUT/service-newest-xcode"
          python3 macos/tests/fake_trace_service.py "$OUT/service-newest-xcode" 8766 &
          SERVICE_PID=$!
          sleep 2
          export DUMPTRIAGE_API_URL=http://127.0.0.1:8766 DUMPTRIAGE_API_KEY=dt_ci_key HOME="$WORK/home-newest-xcode"
          mkdir -p "$HOME"
          status=0
          echo y | /bin/bash macos/dumptriage-collect.sh --xctrace "$SECONDS_TO_CAPTURE" 2>&1 | tee "$OUT/service-newest-xcode/log.txt" || status=1
          kill "$SERVICE_PID" 2>/dev/null || true
          ls -l "$OUT/service-newest-xcode"
          grep -l '"traceType":"xctrace_export"' "$OUT"/service-newest-xcode/*.manifest > /dev/null \
            || { echo "no xctrace_export upload reached the service"; status=1; }
          exit $status

      - name: dSYM lookup by UUID (website#2156)
        continue-on-error: true
        run: |
          # The report page tells a developer to find a missing dSYM with `mdfind "com_apple_xcode_dsym_uuids == <UUID>"`
          # (Apple's TN2151). Build one with a known UUID and try that exactly, with and without a Spotlight index.
          mkdir -p "$WORK/dsym"
          cd "$WORK/dsym"
          clang -g -O0 -o dtburn-dsym "$GITHUB_WORKSPACE/macos/tests/burn.c"
          dsymutil dtburn-dsym -o dtburn-dsym.dSYM
          uuid=$(dwarfdump --uuid dtburn-dsym | awk 'NR==1{print $2}')
          {
            echo "== dwarfdump --uuid (binary, then dSYM)"
            dwarfdump --uuid dtburn-dsym dtburn-dsym.dSYM
            echo "== mdutil -s /"
            mdutil -s / 2>&1
            echo "== mdfind, this folder only"
            mdfind -onlyin "$PWD" "com_apple_xcode_dsym_uuids == $uuid"
            echo "== mdfind, everywhere"
            mdfind "com_apple_xcode_dsym_uuids == $uuid"
            echo "== mdls of the dSYM"
            mdls -name com_apple_xcode_dsym_uuids dtburn-dsym.dSYM
            echo "== mdimport the dSYM, wait, mdfind again"
            mdimport "$PWD/dtburn-dsym.dSYM" 2>&1
            sleep 10
            mdfind -onlyin "$PWD" "com_apple_xcode_dsym_uuids == $uuid"
            mdfind "com_apple_xcode_dsym_uuids == $uuid"
            echo "== mdls again"
            mdls -name com_apple_xcode_dsym_uuids dtburn-dsym.dSYM
            echo "== the same query in lower case"
            mdfind "com_apple_xcode_dsym_uuids == $(echo "$uuid" | tr 'A-F' 'a-f')"
            echo "== importers that mention dSYM or Xcode"
            mdimport -L 2>&1 | grep -i -E 'dsym|xcode|debug' || echo "(none listed)"
            echo "== mdimport -t -d1 on the dSYM bundle and on its DWARF file"
            mdimport -t -d1 "$PWD/dtburn-dsym.dSYM" 2>&1 | head -40
            mdimport -t -d1 "$PWD/dtburn-dsym.dSYM/Contents/Resources/DWARF/dtburn-dsym" 2>&1 | head -20
            echo "== indexing state of this folder and of every volume"
            mdutil -s "$PWD" 2>&1
            mdutil -a -s 2>&1
            echo "== register Xcode's uuid.mdimporter (it supplies com_apple_xcode_dsym_uuids), re-import, wait, mdfind"
            importer="$(xcode-select -p)/../Library/Spotlight/uuid.mdimporter"
            ls -d "$importer" 2>&1
            mdimport -r "$importer" 2>&1
            sleep 5
            mdimport -L 2>&1 | grep -i uuid || echo "(still not listed)"
            mdimport -t -d1 "$PWD/dtburn-dsym.dSYM" 2>&1 | head -5
            mdimport "$PWD/dtburn-dsym.dSYM" 2>&1
            sleep 20
            echo "-- mdls"
            mdls -name com_apple_xcode_dsym_uuids dtburn-dsym.dSYM
            echo "-- mdfind, this folder only, then everywhere (UUID $uuid)"
            mdfind -onlyin "$PWD" "com_apple_xcode_dsym_uuids == $uuid"
            mdfind "com_apple_xcode_dsym_uuids == $uuid"
            echo "== xcode-select and DebugSymbols"
            xcode-select -p
            ls /Applications/Xcode*.app/Contents/Library/Spotlight 2>&1 | head
            ls /Library/Spotlight /System/Library/Spotlight 2>&1 | grep -i -E 'dsym|xcode|debug' || echo "(no dSYM importer in Spotlight folders)"
          } > "$OUT/dsym-lookup.txt" 2>&1
          cat "$OUT/dsym-lookup.txt"

      - name: powermetrics snapshot
        continue-on-error: true
        run: sudo powermetrics -n 1 -i 1000 > "$OUT/powermetrics.txt" 2>&1

      - name: Stop the burner
        if: always()
        run: kill "$BURN_PID" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-trace-capture-${{ matrix.os }}
          path: capture/
          retention-days: 30

      - name: Every capture produced output
        run: |
          ls -l "$OUT"
          missing=0
          for f in spindump.txt spindump-target.txt sample.txt xctrace-time-profile.xml; do
            if [ ! -s "$OUT/$f" ]; then echo "missing or empty: $f"; missing=1; fi
          done
          exit $missing

name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema  # the tracing schema tests (#26); the agent itself needs only the standard library
      - run: python3 -m unittest discover -s linux/dumptriage-agent/tests
      - run: bash -n linux/configure-dumps.sh linux/configure-tracing.sh linux/dumptriage-agent/installer/*.sh
      - run: bash linux/tests/test_configure_tracing.sh
      - run: bash linux/tests/test_install_perfetto.sh
      - run: bash linux/tests/test_install_reference.sh

  windows-agent-common:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test windows/dumptriage-agent/tests/DumpTriage.Common.Tests
      - run: dotnet test windows/dumptriage-agent/tests/DumpTriageAgent.Tests

  windows-agent-on-windows:
    # The Windows-only parts (ACLs on the data folder) need a real Windows host.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test windows/dumptriage-agent/tests/DumpTriageAgent.Tests
      - run: dotnet build windows/dumptriage-agent/src/DumpTriageTray

  powershell-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every .ps1 parses
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; Write-Host "$($f.FullName)"; $errors | ForEach-Object { Write-Host "  $_" } }
          }
          if ($failed) { exit 1 }
      - name: Windows installer checks
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File windows/dumptriage-agent/installer/tests/Test-Install.ps1

  macos-collect:
    # Plain bash with fake curl/security/spindump on PATH, so it runs on Linux too.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash macos/tests/test_collect.sh

  ninjaone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pwsh -NoProfile -NonInteractive -File rmm/ninjaone/tests/Run-Tests.ps1

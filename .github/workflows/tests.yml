name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s linux/dumptriage-agent/tests
      - run: bash -n linux/configure-dumps.sh linux/dumptriage-agent/installer/*.sh

  windows-agent-common:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test windows/dumptriage-agent/tests/DumpTriage.Common.Tests
      - run: dotnet test windows/dumptriage-agent/tests/DumpTriageAgent.Tests

  windows-agent-on-windows:
    # The Windows-only parts (ACLs on the data folder) need a real Windows host.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test windows/dumptriage-agent/tests/DumpTriageAgent.Tests
      - run: dotnet build windows/dumptriage-agent/src/DumpTriageTray

  powershell-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every .ps1 parses
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; Write-Host "$($f.FullName)"; $errors | ForEach-Object { Write-Host "  $_" } }
          }
          if ($failed) { exit 1 }
      - name: Windows installer checks
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File windows/dumptriage-agent/installer/tests/Test-Install.ps1

  macos-collect:
    # Plain bash with fake curl/security/spindump on PATH, so it runs on Linux too.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash macos/tests/test_collect.sh

  ninjaone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -NonInteractive -File rmm/ninjaone/tests/Run-Tests.ps1
